name: Release

# Push a tag such as v0.2.0 to release. The release is only created after the
# tag has been checked against manifest.json, so a mismatched tag never becomes
# a release that HACS or the Marketplace would offer.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Check version and create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # HACS and the Home Assistant Marketplace install from the tagged source,
      # so the manifest in the tag must already carry the release version.
      - name: Tag must match the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/paperclip/manifest.json'))['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi

      # Convenience asset for manual installs. hacs.json does not set
      # zip_release, so HACS keeps installing from the tagged source.
      - name: Zip the integration
        run: |
          cd custom_components/paperclip
          zip -r "${GITHUB_WORKSPACE}/paperclip.zip" . -x "__pycache__/*"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" paperclip.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}"
