name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  pytest:
    name: Pytest (Home Assistant stable)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_common.txt
            requirements_test.txt

      - name: Install requirements
        run: python3 -m pip install -r requirements_common.txt -r requirements_test.txt

      - name: Run tests with coverage
        run: python3 -m pytest --cov-fail-under=95

  pytest-minimum:
    name: Pytest (Home Assistant minimum, 2026.9.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_common.txt
            requirements_test_min.txt

      - name: Install requirements
        run: python3 -m pip install -r requirements_common.txt -r requirements_test_min.txt

      - name: Run tests
        run: python3 -m pytest --no-cov

  pytest-beta:
    name: Pytest (Home Assistant beta, informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the newest pre-release test harness
        run: |
          python3 -m pip install -r requirements_common.txt -r requirements_test.txt
          python3 -m pip install --upgrade --pre pytest-homeassistant-custom-component

      - name: Run tests
        run: python3 -m pytest --no-cov
